[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "techdeals"
version = "0.1.0"
description = "Data pipeline for parsing hardware marketplace listings using LLMs"
requires-python = ">=3.12"
dependencies = [
    "instructor",
    "pydantic>=2.0",
    "pydantic-settings",
    "psycopg[binary]",
    "asyncpg",
    "httpx",
    "rich",
    "beautifulsoup4>=4.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
techdeals = "techdeals.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/techdeals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/techdeals/parser/prompts.py" = ["E501"]

[tool.uv]
# Fleet release-age soak (MooseGooseConsulting/renovate-config ADR 0001): resolve only
# files uploaded at least 4 days ago, in Renovate lock updates and in a local `uv lock`.
# Needs uv 0.9.17 or later. For a security fix younger than 4 days, add
# `exclude-newer-package = { <name> = "<RFC 3339 time just after the fix's last file>" }`
# and run `uv lock --upgrade-package <name>`. Once that last file is 4 days old, remove
# the entry and run `uv lock`; removing it earlier downgrades the package again.
exclude-newer = "4 days"
